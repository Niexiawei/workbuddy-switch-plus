[package]
name = "wb-switch-proxy"
version = "0.1.3"
edition = "2021"
description = "WB-Switch-Plus 内置反代（Rust 版，替代独立 Python 服务）"

[dependencies]
wb-switch-core = { path = "../wb-switch-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"
pbkdf2 = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
