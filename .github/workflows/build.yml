# 发布工作流：GitHub Release 发布时自动构建四平台产物并回传到该 Release。
#
# 触发：
#   · 发布 Release（推 v* 标签并在 Releases 页点 Publish）→ 自动跑全平台；
#   · workflow_dispatch：手动跑，可只选一个平台（用于验证构建，不产生 Release）。
#
# 平台矩阵（反代已并入 Rust 桌面端，数据面随主程序启动）：
#   · win-x64    —— Windows 原生构建，NSIS 安装包；**唯一**额外打包 Python 版反代
#                  （wb-reverse-proxy.exe，经 tauri.windows.conf.json 作为 bundle 资源
#                  随包分发，作为 Rust 内置反代的退回选项，可从界面切回）；
#   · mac-arm64  —— macOS 14 arm 原生构建（aarch64），app 包 + 自打 DMG；
#   · mac-x64    —— macOS 14 arm runner 交叉编译 x86_64（Apple 双架构 SDK 自带支持）；
#   · linux-x64  —— Ubuntu 原生构建，deb + AppImage。
#
# 历史说明：旧版本工作流只做 win-x64 且测试独立在 test.yml；现在测试由本地
# （cargo test / npm test）把关，CI 只做发版构建，test.yml 已移除。

name: build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: "手动运行时构建哪个平台（Release 发布触发时恒为全平台）"
        type: choice
        default: all
        options:
          - all
          - win-x64
          - mac-arm64
          - mac-x64
          - linux-x64

permissions:
  contents: write

jobs:
  select-matrix:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          # 四平台全量。win-x64 是唯一带 Python 反代退回包的平台（见文件头注释）。
          all_platforms = [
              {
                  "name": "win-x64",
                  "os": "windows-latest",
                  "target": "x86_64-pc-windows-msvc",
                  "bundles": "nsis",
                  "update_os": "windows",
                  "update_arch": "x86_64",
                  "update_bundle": "nsis",
                  "update_archive_name": "wb-switch-plus-windows-x86_64-setup.exe",
              },
              {
                  "name": "mac-arm64",
                  "os": "macos-14",
                  "target": "aarch64-apple-darwin",
                  "bundles": "app",
                  "update_os": "macos",
                  "update_arch": "aarch64",
                  "update_bundle": "macos",
                  "update_archive_name": "wb-switch-plus-macos-aarch64.app.tar.gz",
              },
              {
                  "name": "mac-x64",
                  "os": "macos-14",
                  "target": "x86_64-apple-darwin",
                  "bundles": "app",
                  "update_os": "macos",
                  "update_arch": "x86_64",
                  "update_bundle": "macos",
                  "update_archive_name": "wb-switch-plus-macos-x86_64.app.tar.gz",
              },
              {
                  "name": "linux-x64",
                  "os": "ubuntu-latest",
                  "target": "x86_64-unknown-linux-gnu",
                  "bundles": "deb,appimage",
                  "update_os": "linux",
                  "update_arch": "x86_64",
                  "update_bundle": "appimage",
                  "update_archive_name": "wb-switch-plus-linux-x86_64.AppImage",
              },
          ]
          event = os.environ.get("EVENT_NAME", "")
          platform = (os.environ.get("PLATFORM") or "all").strip()
          if event != "workflow_dispatch" or platform in ("", "all"):
              selected = all_platforms
          else:
              selected = [p for p in all_platforms if p["name"] == platform]
              if not selected:
                  raise SystemExit(f"unknown platform: {platform}")
          matrix = json.dumps({"include": selected})
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("matrix<<EOF\n")
              f.write(matrix + "\n")
              f.write("EOF\n")
          PY

  build:
    name: ${{ matrix.name }}
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # 该 action 默认给 RUSTFLAGS 加 -D warnings，会把 vendor/agent-companion
          # 快照在部分 cfg 下的 dead_code 告警升级成错误。发版构建不需要这层门禁。
          rustflags: ""

      # cargo 缓存：依赖 + 编译产物，增量编译大幅提速（Cargo.lock 不变时命中）。
      # mac-x64 在 arm runner 上交叉编译 x86_64，用独立 key 前缀避免污染原生缓存。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      # dmgbuild writes Finder metadata without opening Finder, so DMGs keep
      # their large icons and drag arrow in headless macOS runners.
      - name: Set up Python for dmgbuild
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dmgbuild (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMGBUILD_VENV="$RUNNER_TEMP/dmgbuild-venv"
          python3 -m venv "$DMGBUILD_VENV"
          "$DMGBUILD_VENV/bin/python" -m pip install --disable-pip-version-check --no-input \
            "dmgbuild==1.6.7"
          echo "$DMGBUILD_VENV/bin" >> "$GITHUB_PATH"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 只有 win-x64 打包 Python 版反代（退回选项）。它被 tauri.windows.conf.json
      # 声明成 bundle 资源，而 `resources` 里声明过的路径必须存在，缺文件 tauri
      # build 会直接报错退出——所以必须在「Build desktop app」之前产出。
      - name: Build Python reverse-proxy (fallback, Windows only)
        if: matrix.name == 'win-x64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python reverse-proxy exe
        if: matrix.name == 'win-x64'
        shell: bash
        env:
          # runner 的 stdout 默认 cp1252，中文输出会 UnicodeEncodeError
          PYTHONUTF8: "1"
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r reverse-proxy/requirements.txt pyinstaller
          ( cd reverse-proxy && python build-exe.py )
          test -f reverse-proxy/dist/wb-reverse-proxy.exe
          ls -la reverse-proxy/dist/

      # 前端构建产物（Tauri App 使用；beforeBuildCommand 同口径，含 Companion
      # 资源与 agent-studio-runtime 编译——AGENT_COMPANION_TARGET 决定 runtime
      # 编到哪个架构，交叉编译 mac-x64 也由它落到正确目标）。
      - name: Build frontend
        shell: bash
        env:
          AGENT_COMPANION_TARGET: ${{ matrix.target }}
        run: |
          npm install
          npm run build:desktop

      # 桌面 App（nsis exe / mac app + DMG / deb + AppImage）
      - name: Build desktop app
        shell: bash
        env:
          # Secret 里存的是 base64 包裹的 minisign 私钥（本地
          # ~/.wb-switch-plus/wb-switch-updater.key 的原样内容）。直接把 base64
          # 喂给 tauri 会报 "Missing comment in secret key"——它要的是解码后的
          # 「untrusted comment: ...」三行格式，所以这里先解码。
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9] ]]; then
            VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          KEY_FILE="$RUNNER_TEMP/updater.key"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_B64" ]; then
            echo "error: secret TAURI_SIGNING_PRIVATE_KEY is empty" >&2
            exit 1
          fi
          # Secret 应为 base64 包裹的 minisign 私钥（本地 .key 文件原样内容）。
          # 先解码校验格式（防贴错成明文或密钥体片段），但**喂给 tauri 的是
          # 原样 base64**——tauri CLI 内部会自己做 base64 解码，明文反而报
          # "Invalid symbol ... offset 9"（明文首行 "untrusted " 的空格）。
          if printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_B64" | base64 -d > "$KEY_FILE" 2>/dev/null; then
            head -1 "$KEY_FILE" | grep -q '^untrusted comment:' || {
              echo "error: secret decodes to something that is NOT a minisign secret key" >&2
              echo "       (first line should be 'untrusted comment: ...')" >&2
              echo "       please paste the RAW content of ~/.wb-switch-plus/wb-switch-updater.key" >&2
              exit 1
            }
            echo "secret format check: OK (base64-wrapped minisign key)"
          else
            echo "error: secret is not valid base64 — it looks like the DECODED plaintext key." >&2
            echo "       paste the RAW content of ~/.wb-switch-plus/wb-switch-updater.key instead" >&2
            echo "       (the 348-char single-line base64 string), not the 'untrusted comment:' text" >&2
            exit 1
          fi
          rm -f "$KEY_FILE"
          export TAURI_SIGNING_PRIVATE_KEY="$TAURI_SIGNING_PRIVATE_KEY_B64"
          BUNDLE_ROOT="target/${{ matrix.target }}/release/bundle"
          # cargo cache 会保留旧 NSIS/DMG/AppImage；不清理就会把旧版本产物带进 Release。
          rm -rf "$BUNDLE_ROOT"
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          echo "bundle after build:"
          find "$BUNDLE_ROOT" -type f | sort || true
          mkdir -p dist-bin
          if [ "${{ matrix.bundles }}" = "nsis" ]; then
            STALE=$(find "$BUNDLE_ROOT" -type f -name '*-setup.exe' ! -name "WB-Switch-Plus_${VER}_x64-setup.exe" || true)
            if [ -n "$STALE" ]; then
              echo "error: stale Windows installer still present:" >&2
              printf '%s\n' "$STALE" >&2
              exit 1
            fi
            test -f "$BUNDLE_ROOT/nsis/WB-Switch-Plus_${VER}_x64-setup.exe"
          fi
          find "$BUNDLE_ROOT" -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' \) \
            -exec cp {} dist-bin/ \;
          # mac：纯命令行打 dmg（CI 无 Finder，Tauri 自带的 bundle_dmg.sh 会失败）
          if [ "${{ matrix.bundles }}" = "app" ]; then
            sh scripts/make-dmg.sh "$VER" "${{ matrix.update_arch }}" "target/${{ matrix.target }}/release/bundle/macos/WB-Switch-Plus.app"
            cp "wb-switch-plus_${VER}_${{ matrix.update_arch }}.dmg" dist-bin/
          fi

      - name: Generate updater manifest
        shell: bash
        env:
          UPDATE_OS: ${{ matrix.update_os }}
          UPDATE_ARCH: ${{ matrix.update_arch }}
          UPDATE_ARCHIVE_NAME: ${{ matrix.update_archive_name }}
          BUNDLE_DIR: target/${{ matrix.target }}/release/bundle/${{ matrix.update_bundle }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ! [[ "$VER" =~ ^[0-9] ]]; then
            VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          echo "updater bundle dir: $BUNDLE_DIR (version $VER)"
          ls -la "$BUNDLE_DIR" || true
          if [ "$UPDATE_OS" = "linux" ]; then
            # linux 有 deb / AppImage 两种安装形态：各自收集归档与签名，再生成两份 manifest。
            LINUX_ROOT="$(dirname "$BUNDLE_DIR")"
            APPIMAGE="$(find "$LINUX_ROOT/appimage" -maxdepth 1 -type f -name '*.AppImage' | sort)"
            DEB="$(find "$LINUX_ROOT/deb" -maxdepth 1 -type f -name '*.deb' | sort)"
            APPIMAGE_COUNT=$(printf '%s\n' "$APPIMAGE" | sed '/^$/d' | wc -l | tr -d ' ')
            DEB_COUNT=$(printf '%s\n' "$DEB" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$APPIMAGE_COUNT" != 1 ] || [ "$DEB_COUNT" != 1 ]; then
              echo "error: expected exactly 1 .AppImage and 1 .deb, found $APPIMAGE_COUNT / $DEB_COUNT" >&2
              printf 'appimage: %s\ndeb: %s\n' "$APPIMAGE" "$DEB" >&2
              exit 1
            fi
            if [ ! -f "$APPIMAGE.sig" ] || [ ! -f "$DEB.sig" ]; then
              echo "error: missing signature for $APPIMAGE or $DEB" >&2
              exit 1
            fi
            cp "$APPIMAGE" "dist-bin/wb-switch-plus-linux-${UPDATE_ARCH}.AppImage"
            cp "$APPIMAGE.sig" "dist-bin/wb-switch-plus-linux-${UPDATE_ARCH}.AppImage.sig"
            cp "$DEB" "dist-bin/wb-switch-plus-linux-${UPDATE_ARCH}.deb"
            cp "$DEB.sig" "dist-bin/wb-switch-plus-linux-${UPDATE_ARCH}.deb.sig"
            UPDATE_VERSION="$VER" UPDATE_OS=linux UPDATE_ARCH="$UPDATE_ARCH" UPDATE_BUNDLE=appimage \
              UPDATE_KEYS="linux-${UPDATE_ARCH}-appimage linux-${UPDATE_ARCH}" \
              UPDATE_ARCHIVE_NAME="wb-switch-plus-linux-${UPDATE_ARCH}.AppImage" \
              UPDATE_JSON_NAME="latest-linux-${UPDATE_ARCH}.json" \
              BUNDLE_DIR="$LINUX_ROOT/appimage" sh scripts/gen-update-json.sh
            UPDATE_VERSION="$VER" UPDATE_OS=linux UPDATE_ARCH="$UPDATE_ARCH" UPDATE_BUNDLE=deb \
              UPDATE_KEYS="linux-${UPDATE_ARCH}-deb" \
              UPDATE_ARCHIVE_NAME="wb-switch-plus-linux-${UPDATE_ARCH}.deb" \
              UPDATE_JSON_NAME="latest-linux-deb-${UPDATE_ARCH}.json" \
              BUNDLE_DIR="$LINUX_ROOT/deb" sh scripts/gen-update-json.sh
            cp "$LINUX_ROOT/appimage/latest-linux-${UPDATE_ARCH}.json" dist-bin/
            cp "$LINUX_ROOT/deb/latest-linux-deb-${UPDATE_ARCH}.json" dist-bin/
            exit 0
          fi
          if [ "$UPDATE_OS" = "windows" ]; then
            ARCHIVE="$BUNDLE_DIR/WB-Switch-Plus_${VER}_x64-setup.exe"
          else
            ARCHIVE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.app.tar.gz' | sort)"
            COUNT=$(printf '%s\n' "$ARCHIVE" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$COUNT" != 1 ]; then
              echo "error: expected exactly 1 .app.tar.gz, found $COUNT" >&2
              printf '%s\n' "$ARCHIVE" >&2
              exit 1
            fi
          fi
          if [ ! -f "$ARCHIVE" ] || [ ! -f "$ARCHIVE.sig" ]; then
            echo "error: missing signed updater archive ($ARCHIVE)" >&2
            exit 1
          fi
          cp "$ARCHIVE" "dist-bin/$UPDATE_ARCHIVE_NAME"
          cp "$ARCHIVE.sig" "dist-bin/$UPDATE_ARCHIVE_NAME.sig"
          if [ "$UPDATE_OS" = "windows" ]; then
            cmp -s "dist-bin/$UPDATE_ARCHIVE_NAME" "dist-bin/WB-Switch-Plus_${VER}_x64-setup.exe"
          fi
          UPDATE_VERSION="$VER" sh scripts/gen-update-json.sh
          MANIFEST="$BUNDLE_DIR/latest-${UPDATE_OS}-${UPDATE_ARCH}.json"
          test -f "$MANIFEST"
          cp "$MANIFEST" dist-bin/

      # 发布前自检：产物里不允许残留构建机绝对路径（见脚本头注释）。
      # 只有 Windows 存在裸 exe 默认路径，其余平台显式传入产物逐个扫。
      # 注意必须排除 .d（cargo depfile，纯文本、天生记录构建机绝对路径，
      # 不随包分发、不在扫描范围）。也排除 .pdb/.dSYM 等符号文件。
      - name: Verify binaries (no build-machine path leaks)
        shell: bash
        run: |
          PATTERN="target/${{ matrix.target }}/release"
          ARGS=$(find "$PATTERN" -maxdepth 1 -type f \
            \( -name 'wb-switch-rust' -o -name 'wb-switch-rust.exe' \
            -o -name 'wb-reverse-proxy' -o -name 'wb-reverse-proxy.exe' \) 2>/dev/null || true)
          if [ -n "$ARGS" ]; then
            # shellcheck disable=SC2086
            node scripts/verify-release-binary.mjs $ARGS
          else
            echo "no bare binaries found, skip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge updater manifests
        env:
          # 缺平台是静默故障（Linux 曾因此 18 个版本收不到更新），合并后强制校验键齐全
          REQUIRED_PLATFORMS: >-
            windows-x86_64-nsis,windows-x86_64,
            darwin-aarch64,darwin-x86_64,
            linux-x86_64,linux-x86_64-deb,linux-x86_64-appimage
        run: python3 scripts/merge-update-manifests.py artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
